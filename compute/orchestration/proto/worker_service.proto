syntax = "proto3";

package acutesim.worker;

// The WorkerService defines the interface for all external EDA tools.
// Whether the worker is a local Docker container or a cloud cluster,
// the UI interacts with it via this API.
service WorkerService {
  // Check health and capabilities
  rpc GetStatus (StatusRequest) returns (StatusResponse);

  // Logic Synthesis (RTL -> Gate-Level Netlist)
  rpc RunSynthesis (SynthesisRequest) returns (stream SynthesisLog);

  // Place & Route (Netlist -> GDSII/DEF)
  rpc RunPlaceAndRoute (PnRRequest) returns (stream PnRLog);

  // Digital Logic Simulation (Verilator/Icarus)
  rpc RunHDLSimulation (HDLSimulationRequest) returns (stream HDLSimulationLog);

  // Analog/Mixed-Signal Circuit Simulation (Tensor MNA)
  rpc RunCircuitSimulation (CircuitSimulationRequest) returns (stream CircuitSimulationLog);

  // Sign-Off (DRC/LVS/PEX via KLayout)
  rpc RunSignOff (SignOffRequest) returns (stream SignOffLog);

  // Parity Validation (Regression Harness)
  rpc RunRegression (RegressionRequest) returns (stream RegressionLog);
}

// ============================================================================
// COMMON TYPES
// ============================================================================

message StatusRequest {}

message StatusResponse {
  string worker_id = 1;
  string version = 2; // e.g. "0.1.0"
  bool ready = 3;
  double cpu_usage = 4;
  double memory_usage = 5;
  // Map of tool name to version string, e.g. {"yosys": "0.40", "openroad": "2.0"}
  map<string, string> tools = 6; 
}

message FileData {
  string filename = 1;
  bytes content = 2;
}

// ============================================================================
// SYNTHESIS (Yosys)
// ============================================================================

message SynthesisRequest {
  string job_id = 1;
  repeated FileData source_files = 2; // Verilog/VHDL
  string top_module = 3;
  string target_library = 4;          // "sky130_fd_sc_hd"
  
  // Optimization constraints
  message Constraints {
    double max_area = 1;
    double max_delay = 2;
    string optimization_goal = 3;     // "AREA", "SPEED", "POWER"
  }
  Constraints constraints = 5;
}

message SynthesisLog {
  string job_id = 1; // Explicit job ID for multiplexing
  string log_line = 2;
  bool is_error = 3;
  bool is_finished = 4;
  
  // Result artifacts (only in final message)
  FileData netlist = 5;
  FileData report = 6;
}

// ============================================================================
// PLACE & ROUTE (OpenROAD)
// ============================================================================

message PnRRequest {
  string job_id = 1;
  FileData netlist = 2;               // Gate-level netlist
  string constraint_file = 3;         // SDC file content
  
  message Floorplan {
    double die_width = 1;
    double die_height = 2;
    double core_width = 3;
    double core_height = 4;
  }
  Floorplan floorplan = 4;
}

message PnRLog {
  string job_id = 1;
  string log_line = 2;
  float progress = 3;                 // 0.0 to 1.0
  bool is_finished = 4;
  
  // Result artifacts
  FileData def_file = 5;
  FileData gds_file = 6;
}

// ============================================================================
// HDL SIMULATION (Verilator/Icarus)
// ============================================================================

message HDLSimulationRequest {
  string job_id = 1;
  repeated FileData source_files = 2;
  string testbench_module = 3;
}

message HDLSimulationLog {
  string job_id = 1;
  string log_line = 2;
  bool is_finished = 3;
  
  // VCD waveform data
  bytes vcd_chunk = 4;
}

// ============================================================================
// CIRCUIT SIMULATION (Tensor MNA)
// ============================================================================

message CircuitSimulationRequest {
  string job_id = 1;
  FileData netlist_json = 2;       // The flattened TensorNetlist JSON
  string solver_mode = 3;          // "cpu", "cpu_simd", "gpu"
  string precision = 4;            // "fp64", "fp64_emulated"
  
  message Analysis {
      string type = 1;             // "TRAN", "DC", "AC"
      double t_start = 2;
      double t_stop = 3;
      double t_step = 4;
  }
  Analysis analysis = 5;
}

message CircuitSimulationLog {
  string job_id = 1;
  string log_line = 2;
  bool is_finished = 3;
  
  // Streamed numerical results (JSON or binary format)
  bytes result_chunk = 4; 
}

// ============================================================================
// REGRESSION (Parity Harness)
// ============================================================================

message RegressionRequest {
  string job_id = 1;
  string suite_name = 2; // e.g. "all", "fpu_determinism" -- maps to executable args
  string solver_mode = 3; // "cpu", "cpu_simd", "gpu"
  string precision = 4;   // "fp64", "fp64_emulated"
}

message RegressionLog {
  string job_id = 1;
  string log_line = 2;
  bool is_error = 3;
  bool is_finished = 4;
  bool passed = 5;       // Only valid if is_finished=true

  // Optional result data (e.g. JSON summary)
  string result_json = 6;
}

// ============================================================================
// SIGN-OFF (KLayout DRC/LVS/PEX)
// ============================================================================

message SignOffRequest {
  string job_id = 1;
  FileData layout_file = 2;          // GDS/OASIS file
  FileData script_file = 3;          // Ruby/DRC script
  string check_type = 4;             // "DRC", "LVS", "PEX"

  // Optional: reference netlist for LVS
  FileData reference_netlist = 5;
}

message SignOffLog {
  string job_id = 1;
  string log_line = 2;
  bool is_error = 3;
  bool is_finished = 4;

  // Result artifacts (only in final message)
  FileData report = 5;
}
