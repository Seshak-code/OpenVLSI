syntax = "proto3";

package acutesim.simulation;

// ============================================================================
// simulation_service.proto — Structured Simulation Service Contract
// ============================================================================
// Wire contract for RemoteGrpcDriver <-> SimulationServer.
//
// This is a NEW service, separate from WorkerService (which covers EDA tools).
// WorkerService.RunCircuitSimulation streams opaque bytes; this service exposes
// fully-typed structured results mapped 1-to-1 from simulation_dto.h.
//
// BACKWARD COMPATIBILITY INVARIANT:
//   Never renumber field IDs. Never remove fields — mark deprecated instead.
//   Add new fields with new IDs only. Proto3 default values are always safe.
//
// STREAMING MODEL:
//   All three submit RPCs use server-streaming: the client makes one call and
//   receives a sequence of SimulationEvent messages until is_finished = true.
//   CancelJob is a unary RPC that signals the server to stop mid-stream.
//   The stream is always drained cleanly before closing (no hard abort).
//
// JOBID / SESSION TOKEN STRATEGY:
//   The GUI uses uint64 JobID internally. Over the wire we use string
//   session_token (UUID-style, from SimulationRequestDTO.sessionToken).
//   RemoteGrpcDriver::Impl maintains the local jobId <-> token mapping.
// ============================================================================

service SimulationService {
  // Single analysis run. Streams progress events, then a final run_result
  // with is_finished = true.
  rpc SubmitJob (SimulationRequest) returns (stream SimulationEvent);

  // Parametric sweep / generic batch. Per-run results stream as they complete.
  // Final event carries BatchSummary with is_finished = true.
  rpc SubmitBatchJob (SimulationBatchRequest) returns (stream SimulationEvent);

  // Monte Carlo: server generates seeded RNG variations via BatchExecutionEngine.
  // Same determinism guarantee as LocalWorkerDriver (seed 42 → bit-identical).
  // Streams per-run results + final BatchSummary with statistics.
  rpc SubmitStatisticalJob (StatisticalJobRequest) returns (stream SimulationEvent);

  // Signal cancellation of an in-progress job. The server sets its cancel flag;
  // the stream will still drain remaining in-flight events before closing.
  rpc CancelJob (CancelRequest) returns (CancelAck);

  // Query which analyses, corners, and features the server supports.
  rpc GetCapabilities (CapabilitiesRequest) returns (CapabilitiesResponse);
}

// ============================================================================
// STREAMING EVENT (the unified response envelope)
// ============================================================================

// All three SubmitXxx RPCs produce a stream of SimulationEvents.
// Read session_token to demultiplex concurrent streams.
// The stream ends when is_finished = true.
message SimulationEvent {
  string session_token = 1;
  bool   is_finished   = 2;  // True on the final message of the stream

  oneof payload {
    // Progress of the current single run (percent 0.0–1.0 + human message)
    ProgressEvent progress = 3;

    // Completed single run OR one run inside a batch/MC campaign.
    // For batch/MC: arrives for each run as it finishes (not all at the end).
    // run_result.run_index == -1 for single runs, 0..N for batch/MC.
    SimulationResult run_result = 4;

    // Batch-specific progress: how many of the N runs have completed.
    BatchProgressEvent batch_progress = 5;

    // Final message for batch/MC jobs (is_finished is also true here).
    // Carries statistical summary only — individual results were already streamed.
    BatchSummary batch_summary = 6;

    // Unrecoverable error. is_finished is also true after an error event.
    ErrorEvent error = 7;
  }
}

// ============================================================================
// CORNER PARAMETERS
// Mirrors CornerParametersDTO exactly.
// ============================================================================

message CornerParameters {
  string name            = 1;  // Human label, e.g. "TT"
  double temperature     = 2;  // °C
  double supply_voltage  = 3;  // V (nominal)
  double voltage_scale   = 4;  // Multiplier vs nominal (1.0 = nominal)
  string process_corner  = 5;  // "TT", "FF", "SS", "SF", "FS"
}

// ============================================================================
// SIMULATION REQUEST  (mirrors SimulationRequestDTO)
// ============================================================================

// Matches AnalysisTypeDTO enum values 1-to-1.
enum AnalysisType {
  DC          = 0;
  TRANSIENT   = 1;
  AC          = 2;
  NOISE       = 3;
  MONTE_CARLO = 4;
  SENSITIVITY = 5;
}

enum NetlistFormat {
  JSON_LEGACY = 0;
  VERILOG_A   = 1;
}

message SimulationSource {
  NetlistFormat format = 1;
  string payload       = 2;
}

message SimulationRequest {
  string session_token  = 1;
  // [DEPRECATED] Use source instead.
  string netlist_json   = 2 [deprecated = true];
  
  // [NEW] Canonical source transport
  SimulationSource source = 7;

  AnalysisType analysis = 3;
  map<string, string> parameters = 4;
  CornerParameters corner = 5;
  uint64 topology_hash  = 6;
}

// ============================================================================
// BATCH REQUEST  (mirrors SimulationBatchRequestDTO)
// ============================================================================

message ParameterVariation {
  string component_name = 1;  // e.g. "R1"
  string property_name  = 2;  // "resistance", "capacitance", "inductance"
  double override_value = 3;
}

message BatchRun {
  uint32 run_index = 1;
  repeated ParameterVariation overrides = 2;
}

message SimulationBatchRequest {
  string session_token        = 1;
  // [DEPRECATED] Use source instead.
  string base_netlist_json    = 2 [deprecated = true];

  // [NEW] Canonical source transport
  SimulationSource source     = 7;

  AnalysisType analysis       = 3;
  map<string, string> parameters = 4;
  CornerParameters corner     = 5;
  repeated BatchRun runs      = 6;
}

// ============================================================================
// STATISTICAL (MONTE CARLO) REQUEST  (mirrors MonteCarloConfigDTO)
// ============================================================================

message MonteCarloVariation {
  string component_name    = 1;
  string property_name     = 2;
  string distribution_type = 3;  // "Gaussian" or "Uniform"
  double nominal_value     = 4;
  double tolerance         = 5;  // 0.05 = 5%
}

message MonteCarloConfig {
  uint32 sample_count = 1;
  uint64 seed         = 2;  // Deterministic: same seed → bit-identical results
  repeated MonteCarloVariation variations = 3;
}

message StatisticalJobRequest {
  SimulationRequest base_request = 1;
  MonteCarloConfig  mc_config    = 2;
}

// ============================================================================
// SIMULATION RESULT  (mirrors SimulationResponseDTO)
// ============================================================================

// Helper: a time series or frequency vector for one channel.
// packed=true saves ~50% wire size for dense double arrays.
message TimeSeries {
  repeated double values = 1 [packed = true];
}

message ConvergenceTelemetry {
  int32  iterations            = 1;
  double max_residual          = 2;
  string method                = 3;
  bool   gmin_stepping_used    = 4;
  bool   source_stepping_used  = 5;
  double solve_time_ms         = 6;
}

message SimulationResult {
  string session_token = 1;
  bool   success       = 2;
  string error_message = 3;
  // -1 for single runs; 0..N for batch/MC runs
  int32  run_index     = 4;

  // X-axis: time (transient) or frequency (AC)
  repeated double time_vector = 5 [packed = true];

  // Node voltages by node index
  map<int32, TimeSeries> node_voltages   = 6;

  // Named probe results (probeName -> voltage/current array)
  map<string, TimeSeries> probe_values   = 7;

  // DC operating point (single double per node, DC analysis only)
  repeated double dc_operating_point = 8 [packed = true];

  ConvergenceTelemetry convergence = 9;
}

// ============================================================================
// BATCH SUMMARY  (final message for batch/MC — mirrors SimulationBatchResponseDTO)
// Note: individual run_results were already streamed; this carries only
// the aggregate metadata + statistical summary.
// ============================================================================

message StatisticalSummary {
  map<string, double> mean    = 1;
  map<string, double> stddev  = 2;
  map<string, double> min_val = 3;
  map<string, double> max_val = 4;
}

message BatchSummary {
  string session_token  = 1;
  bool   had_failures   = 2;
  uint32 total_runs     = 3;
  uint32 successful_runs = 4;
  // Populated only for MC runs (empty for plain sweeps)
  StatisticalSummary statistics = 5;
}

// ============================================================================
// PROGRESS AND ERROR EVENTS
// ============================================================================

message ProgressEvent {
  float  percent = 1;  // 0.0–1.0
  string message = 2;
}

message BatchProgressEvent {
  uint32 completed = 1;
  uint32 total     = 2;
}

message ErrorEvent {
  string code    = 1;  // e.g. "SOLVER_DIVERGED", "NETLIST_PARSE_FAILED"
  string message = 2;
}

// ============================================================================
// CANCELLATION
// ============================================================================

message CancelRequest {
  string session_token = 1;
}

message CancelAck {
  string session_token = 1;
  // True if the job was found and the cancel flag was set.
  // False if the job was not found (already finished or unknown token).
  bool accepted = 2;
}

// ============================================================================
// CAPABILITIES
// ============================================================================

message CapabilitiesRequest {}

message CapabilitiesResponse {
  string server_version           = 1;
  repeated string supported_analyses = 2;  // ["DC", "TRANSIENT", "AC"]
  bool   supports_batch           = 3;
  bool   supports_monte_carlo     = 4;
  bool   supports_concurrent_jobs = 5;
  uint32 max_concurrent_jobs      = 6;
  // The 5 standard corners (TT/FF/SS/SF/FS) plus any custom ones
  repeated CornerParameters available_corners = 7;
  // Solver capabilities: "cpu", "cpu_simd", "gpu_dawn"
  repeated string solver_backends = 8;
}
