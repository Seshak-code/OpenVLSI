name: CI

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          
      - name: Configure CMake
        run: |
          cmake -S . -B out/build/windows-msvc -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build out/build/windows-msvc --config Debug

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt and OpenMP with Homebrew
        run: |
          brew update
          brew install qt libomp
          
      - name: Configure CMake
        run: |
          cmake -S . -B out/build/macos -G Ninja \
            -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt/lib/cmake"
      - name: Build
        run: cmake --build out/build/macos
