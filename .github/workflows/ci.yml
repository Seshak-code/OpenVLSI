name: CI

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup vcpkg
        uses: lukka/get-vcpkg@v11
      - name: Install Qt via vcpkg
        run: |
          .\vcpkg install qt6-base:x64-windows
      - name: Configure CMake
        run: |
          cmake -S . -B out/build/windows-msvc -G Ninja -DCMAKE_TOOLCHAIN_FILE=.\vcpkg\scripts\buildsystems\vcpkg.cmake
      - name: Build
        run: cmake --build out/build/windows-msvc --config Debug

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt with Homebrew
        run: |
          brew update
          brew install qt
      - name: Configure CMake
        run: |
          cmake -S . -B out/build/macos -G Ninja -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt/lib/cmake"
      - name: Build
        run: cmake --build out/build/macos
