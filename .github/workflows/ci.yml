name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          # FIX: Use msvc2022_64 to match Visual Studio 17 2022 generator
          arch: 'win64_msvc2022_64'
          
      - name: Configure CMake
        run: |
          cmake -S . -B out/build/windows-msvc -G "Visual Studio 17 2022" -A x64 -DQt6_DIR="$env:Qt6_DIR"
          
      - name: Build Application
        run: cmake --build out/build/windows-msvc --config Release --target AcuteSim
        
      - name: Build Regression Tests
        run: cmake --build out/build/windows-msvc --config Release --target test_regression
        
      - name: Run Regression Suite
        run: |
          cd out/build/windows-msvc/Release
          ./test_regression.exe
        shell: bash
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcuteSim-Windows
          path: out/build/windows-msvc/Release/AcuteSim.exe
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          brew update
          brew install ninja qt libomp
          
      - name: Configure CMake
        run: |
          echo "Finding Qt Path..."
          QT_PATH=$(brew --prefix qt)
          echo "Qt Path found at: $QT_PATH"
          cmake -S . -B out/build/macos -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_PATH/lib/cmake" \
            -DCMAKE_BUILD_TYPE=Release
            
      - name: Build Application
        run: cmake --build out/build/macos --target AcuteSim
        
      - name: Build Regression Tests
        run: cmake --build out/build/macos --target test_regression
        
      - name: Run Regression Suite
        run: |
          cd out/build/macos
          ./test_regression
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcuteSim-macOS
          path: out/build/macos/AcuteSim.app
          if-no-files-found: warn

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev python3
          
      - name: Static Architecture Linting
        run: python3 scripts/check_layering.py
          
      - name: Configure CMake
        run: |
          cmake -S . -B out/build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
            
      - name: Build Application
        run: cmake --build out/build/linux --target AcuteSim
        
      - name: Build Regression Tests
        run: cmake --build out/build/linux --target test_regression
        
      - name: Run Regression Suite
        run: |
          cd out/build/linux
          ./test_regression
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcuteSim-Linux
          path: |
            out/build/linux/AcuteSim
            regression_golden.db
          if-no-files-found: warn

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56
          
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          target: 'wasm_singlethread'
          arch: 'wasm_32'
          
      - name: Configure CMake
        run: |
          emcmake cmake -S . -B out/build/wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
            
      - name: Build Application
        run: cmake --build out/build/wasm --target AcuteSim
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcuteSim-WASM
          path: |
            out/build/wasm/AcuteSim.js
            out/build/wasm/AcuteSim.wasm
            out/build/wasm/AcuteSim.html
            out/build/wasm/qtloader.js
          if-no-files-found: warn
