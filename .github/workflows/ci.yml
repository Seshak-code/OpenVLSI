name: CI

on:
  # Run once a month on the 1st at 02:00 UTC
  schedule:
    - cron: '0 2 1 * *'
  # Still allow manual runs from the Actions tab
  workflow_dispatch:
  # Keep PR checks for main (optional — remove if too noisy)
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B out/build/windows-msvc -G "Visual Studio 17 2022" -A x64 -DQt6_DIR="$env:Qt6_DIR"

      - name: Build Application
        run: cmake --build out/build/windows-msvc --config Release --target AcuteSim

      - name: Build Regression Tests
        run: cmake --build out/build/windows-msvc --config Release --target test_regression
        continue-on-error: true

      - name: Run Regression Suite
        run: |
          cd out/build/windows-msvc/Release
          ./test_regression.exe
        shell: bash
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcuteSim-Windows
          path: out/build/windows-msvc/Release/AcuteSim.exe
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          brew update
          brew install ninja qt@6 libomp re2
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          QT_PATH="$(brew --prefix qt@6)"
          cmake -S . -B out/build/macos -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_PATH/lib/cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: cmake --build out/build/macos --target AcuteSim

      - name: Build Regression Tests
        run: cmake --build out/build/macos --target test_regression
        continue-on-error: true

      - name: Run Regression Suite
        run: |
          cd out/build/macos
          ./test_regression
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcuteSim-macOS
          path: out/build/macos/AcuteSim.app
          if-no-files-found: warn

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            qt6-base-dev \
            qt6-base-private-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            libre2-dev \
            python3

      - name: Static Architecture Linting
        run: python3 scripts/check_layering.py
        continue-on-error: true

      - name: Configure CMake
        run: |
          cmake -S . -B out/build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: cmake --build out/build/linux --target AcuteSim

      - name: Build Regression Tests
        run: cmake --build out/build/linux --target test_regression
        continue-on-error: true

      - name: Run Regression Suite
        run: |
          cd out/build/linux
          ./test_regression
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcuteSim-Linux
          path: |
            out/build/linux/AcuteSim
            regression_golden.db
          if-no-files-found: warn

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Install Qt for WASM
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          target: 'wasm_singlethread'
          arch: 'wasm_32'
          cache: true

      - name: Configure CMake
        run: |
          emcmake cmake -S . -B out/build/wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: cmake --build out/build/wasm --target AcuteSim
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcuteSim-WASM
          path: |
            out/build/wasm/AcuteSim.js
            out/build/wasm/AcuteSim.wasm
            out/build/wasm/AcuteSim.html
            out/build/wasm/qtloader.js
          if-no-files-found: warn
