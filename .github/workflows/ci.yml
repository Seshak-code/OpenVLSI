name: CI

# Weekly (owner's choice), plus a manual run from the Actions tab. GitHub disables a scheduled workflow after
# 60 days without repository activity; re-enable it there.
on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC (TreeSPICE's runs at 06:00)
  workflow_dispatch:

# The app and its test suite on each platform. Third-party C++ libraries come from vcpkg (binary-cached in the
# Actions cache) on Linux and Windows and from Homebrew on macOS; Dawn is fetched by CMake and kept warm by the
# compiler cache. The GPU-labelled tests need a GPU the hosted runners do not have.
jobs:
  app:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, qt-arch: linux_gcc_64, triplet: x64-linux }
          - { name: windows-x86_64, os: windows-2022, qt-arch: win64_msvc2022_64, triplet: x64-windows }
          - { name: macos-arm64, os: macos-14 }
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expose the Actions cache to vcpkg
        if: runner.os != 'macOS'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Qt 6.9
        if: runner.os != 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          arch: ${{ matrix.qt-arch }}
          cache: true

      # Linux and Windows: vcpkg.json's libraries are installed by the vcpkg toolchain at configure time
      - name: Libraries
        run: |
          case "$RUNNER_OS" in
          Linux)
            sudo apt-get install -y -q ninja-build libgl1-mesa-dev libxkbcommon-dev ;;
          macOS)
            brew install ninja qt@6 grpc > /dev/null
            echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV" ;;
          esac

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          max-size: 2G

      - name: Configure
        run: |
          launcher=ccache; [ "$RUNNER_OS" = Windows ] && launcher=sccache
          vcpkg=()
          [ "$RUNNER_OS" != macOS ] && vcpkg=(-DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
                                             -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}")
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${vcpkg[@]}" \
            -DCMAKE_C_COMPILER_LAUNCHER=$launcher -DCMAKE_CXX_COMPILER_LAUNCHER=$launcher

      - name: Build
        run: cmake --build build -j4

      - name: Tests
        run: ctest --test-dir build --output-on-failure -LE gpu --timeout 900
