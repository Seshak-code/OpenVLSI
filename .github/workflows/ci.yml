name: CI

# Weekly (owner's choice), plus a manual run from the Actions tab. GitHub disables a scheduled workflow after
# 60 days without repository activity; re-enable it there.
on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC (TreeSPICE's runs at 06:00)
  workflow_dispatch:

# macOS first (docs/rebuild.md): the other desktops join when their phase starts. Qt comes from Homebrew, SQLite from
# the SDK. The flow and SoC gates skip without ~/eda's tools and datasets/, which the hosted runner does not have.
jobs:
  app:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Libraries
        run: |
          brew install ninja qt@6 > /dev/null
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-arm64
          max-size: 2G

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j4

      - name: Tests
        run: ctest --test-dir build --output-on-failure --timeout 900
