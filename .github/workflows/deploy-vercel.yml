name: Deploy to Vercel

on:
  push:
    branches: [ "main" ]
    paths:
      - 'acutesim_engine/**'
      - 'components/**'
      - 'compute/**'
      - 'physics/**'
      - 'gui/**'
      - 'engine_api/**'
      - 'api/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'vercel.json'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Ninja
        uses: ashley-taylor/configure-ninja@v1.0.3

      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Install Qt 6.9.0 for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          target: 'wasm_singlethread'
          arch: 'wasm_32'
          cache: true

      - name: Configure CMake for WebAssembly
        run: |
          emcmake cmake -S . -B out/build/wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Compile AcuteSim WASM Kernel
        run: |
          cmake --build out/build/wasm --target AcuteSim -j4

      - name: Assemble Vercel Production Distribution
        run: |
          bash scripts/build_wasm_dist.sh

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
